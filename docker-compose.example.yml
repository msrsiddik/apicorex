# ApiCoreX Core — example compose.
#
# This is a documented copy of docker-compose.yml showing every override-able
# env var with its default spelled out (docker-compose.yml itself uses
# ${VAR:-default} so it works with nothing set). Copy relevant values into a
# .env file next to docker-compose.yml, or export them before `docker compose
# up`, or pass them as Jenkins build parameters — do not run this file
# directly; it exists as reference only. Secrets below are placeholders — do
# not deploy with them as-is.
#
# Usage:
#   docker compose up --build
#
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: apicorex
      POSTGRES_PASSWORD: apicorex
      POSTGRES_DB: apicorex
    ports:
      # 15432 on the host so it never collides with a local Postgres.
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apicorex"]
      interval: 5s
      timeout: 3s
      retries: 10

  core:
    build: .
    restart: unless-stopped
    environment:
      HTTP_PORT: ":9999"
      PLUGIN_API_KEY: change-me-plugin-key
      DASHBOARD_SECRET: change-me-dashboard-key
      # PLUGIN_ALLOWLIST: identity,sync
      # Comma-separated origins allowed to call Core from a browser. Empty =
      # no restriction (dev only).
      CORS_ALLOWED_ORIGINS: ""
      # OTLP endpoint (e.g. Jaeger/Tempo). Empty = tracing is a no-op.
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      # Path to a YAML file of per-plugin protection-limit overrides (see
      # config.example.yaml). Empty = use the env-var defaults below.
      CONFIG_FILE: ""
      # Global defaults for rate limiting, bulkheading, and the circuit
      # breaker/timeout — overridden per-plugin by CONFIG_FILE if set.
      RATE_PER_SEC: "1000"
      BULKHEAD_MAX: "100"
      CB_THRESHOLD: "5"
      CB_RESET_TIMEOUT: "30s"
      REQUEST_TIMEOUT: "30s"
      HEALTH_INTERVAL: "30s"
    ports:
      - "9999:9999"

volumes:
  pgdata:
