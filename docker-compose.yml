# ApiCoreX — Core + shared Postgres for the plugins.
#
# Core itself has no database (it's a stateless gateway) — this Postgres
# instance is the SHARED database for the plugins: every plugin (identity,
# sync, zumo-pos, …) connects here, since they read/write per-tenant schemas
# in the same DB. It's exposed on the host as 15432 (not the default 5432) so
# it doesn't collide with a local Postgres. Each plugin repo has its own
# standalone docker-compose.yml that points DATABASE_URL at this same shared
# instance — run this compose file first, then run each plugin repo's compose
# file on its own.
#
# Usage:
#   docker compose up --build
#
services:
  # Optional — off with `docker compose --profile with-postgres up` omitted,
  # on with it included. Jenkins' DEPLOY_OWN_POSTGRES parameter switches this;
  # turn it off when the plugins should point at a Postgres that already runs
  # elsewhere instead.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["with-postgres"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apicorex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apicorex}
      POSTGRES_DB: ${POSTGRES_DB:-apicorex}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apicorex"]
      interval: 5s
      timeout: 3s
      retries: 10

  core:
    build: .
    restart: unless-stopped
    environment:
      HTTP_PORT: ":${CORE_PORT:-9999}"
      PLUGIN_API_KEY: ${PLUGIN_API_KEY:-change-me-plugin-key}
      APICOREX_SECRET: ${APICOREX_SECRET:-apicorex-secret}
      # PLUGIN_ALLOWLIST: identity,sync
      # Comma-separated origins allowed to call Core from a browser. Empty =
      # no restriction (dev only).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # OTLP endpoint (e.g. Jaeger/Tempo). Empty = tracing is a no-op.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Path to a YAML file of per-plugin protection-limit overrides (see
      # config.example.yaml). Empty = use the env-var defaults below.
      CONFIG_FILE: ${CONFIG_FILE:-}
      # Global defaults for rate limiting, bulkheading, and the circuit
      # breaker/timeout — overridden per-plugin by CONFIG_FILE if set.
      RATE_PER_SEC: ${RATE_PER_SEC:-1000}
      BULKHEAD_MAX: ${BULKHEAD_MAX:-100}
      CB_THRESHOLD: ${CB_THRESHOLD:-5}
      CB_RESET_TIMEOUT: ${CB_RESET_TIMEOUT:-30s}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-30s}
      HEALTH_INTERVAL: ${HEALTH_INTERVAL:-30s}
    ports:
      - "${CORE_PORT:-9999}:${CORE_PORT:-9999}"

volumes:
  pgdata:
