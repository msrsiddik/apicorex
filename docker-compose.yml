# ApiCoreX — Core + shared Postgres for the plugins.
#
# Core itself has no database (it's a stateless gateway) — this Postgres
# instance is the SHARED database for the plugins: every plugin (identity,
# sync, zumo-pos, …) connects here, since they read/write per-tenant schemas
# in the same DB. It's exposed on the host as 15432 (not the default 5432) so
# it doesn't collide with a local Postgres. Each plugin repo has its own
# standalone docker-compose.yml that points DATABASE_URL at this same shared
# instance — run this compose file first, then run each plugin repo's compose
# file on its own.
#
# Usage:
#   docker compose up --build
#
services:
  # Optional — off with `docker compose --profile with-postgres up` omitted,
  # on with it included. Jenkins' DEPLOY_OWN_POSTGRES parameter switches this;
  # turn it off when the plugins should point at a Postgres that already runs
  # elsewhere instead.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["with-postgres"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apicorex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apicorex}
      POSTGRES_DB: ${POSTGRES_DB:-apicorex}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apicorex"]
      interval: 5s
      timeout: 3s
      retries: 10

  core:
    build: .
    restart: unless-stopped
    environment:
      HTTP_PORT: ":${CORE_PORT:-9999}"
      PLUGIN_API_KEY: ${PLUGIN_API_KEY:-change-me-plugin-key}
      APICOREX_SECRET: ${APICOREX_SECRET:-apicorex-secret}
      # PLUGIN_ALLOWLIST: identity,sync
      # Comma-separated origins allowed to call Core from a browser. Empty =
      # no restriction (dev only).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Where a browser with no session is sent. A path on this origin, not a
      # URL. Empty keeps the JSON 401 an API client expects, which is also what
      # a person navigating to a page would get.
      LOGIN_URL: ${LOGIN_URL:-}
      # Hostnames that stand for one plugin's surface, so panel.example.com
      # serves what <gateway>/school serves with no prefix in the URL:
      #
      #   PRODUCT_HOSTS=panel.example.com=/school,gl.example.com=/accounting
      #
      # Needs the reverse proxy to preserve Host (Caddyfile.example). Empty is
      # the ordinary case and changes nothing.
      PRODUCT_HOSTS: ${PRODUCT_HOSTS:-}
      # OTLP endpoint (e.g. Jaeger/Tempo). Empty = tracing is a no-op.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Path to a YAML file of per-plugin protection-limit overrides (see
      # config.example.yaml). Empty = use the env-var defaults below.
      CONFIG_FILE: ${CONFIG_FILE:-}
      # Global defaults for rate limiting, bulkheading, and the circuit
      # breaker/timeout — overridden per-plugin by CONFIG_FILE if set.
      RATE_PER_SEC: ${RATE_PER_SEC:-1000}
      BULKHEAD_MAX: ${BULKHEAD_MAX:-100}
      CB_THRESHOLD: ${CB_THRESHOLD:-5}
      CB_RESET_TIMEOUT: ${CB_RESET_TIMEOUT:-30s}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-30s}
      HEALTH_INTERVAL: ${HEALTH_INTERVAL:-30s}
    # Published on every interface by default, which means Core is reachable on
    # the public IP over plain HTTP, past any TLS-terminating proxy in front of
    # it. CORE_BIND=127.0.0.1 closes that — but read the next paragraph first,
    # because on this topology it also breaks registration.
    #
    # Plugins run in their own compose projects and reach Core at
    # host.docker.internal, which resolves to the bridge gateway (172.17.0.1 or
    # similar), not to loopback. A socket bound to 127.0.0.1 does not accept
    # that connection, so every plugin would fail to register. Binding to
    # loopback is only safe once the plugins share a network with Core and
    # address it by service name; short of that, keep the default and block the
    # port at the host firewall instead.
    #
    # The same applies, more sharply, to the plugin ports in each plugin repo's
    # compose file: a request reaching a plugin directly has bypassed Core's
    # auth, rate limiting and route firewall entirely.
    ports:
      - "${CORE_BIND:-0.0.0.0}:${CORE_PORT:-9999}:${CORE_PORT:-9999}"
    # Registration is two-way: a plugin POSTs /_core/register, and Core then
    # pulls /_apicorex/manifest back from the base_url the plugin gave. So Core
    # has to be able to reach the plugin, and a plugin in its own compose
    # project is only reachable through the host.
    #
    # host.docker.internal resolves on its own under Docker Desktop and not on
    # Linux, so a VPS deploy failed here and nowhere else: registration was
    # refused with 502 "cannot pull manifest … no such host", which reads like
    # Core rejecting the plugin rather than Core being unable to call it.
    #
    # Changing this needs the container recreated, not restarted — extra_hosts
    # is written into /etc/hosts when the container is created.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
